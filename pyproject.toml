[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msi-claw-center"
version = "1.3.0"
description = "Native GTK4 / Libadwaita handheld performance and control overlay for MSI Claw A1M on Linux Wayland"
authors = [
    { name = "Le Chi Bang" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
keywords = ["msi-claw", "handheld", "gaming", "wayland", "gtk4", "libadwaita", "kde", "gnome"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
]
dependencies = [
    "PyGObject>=3.42.0",
]

[project.scripts]
msi-claw-center = "msiclaw.ui.app:main"
msi-claw-rgb = "msiclaw.rgb:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["msiclaw*"]
